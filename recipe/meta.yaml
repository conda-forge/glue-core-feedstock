{% set python_min = "3.10" %}
{% set name = "glue-core" %}
{% set version = "1.27.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/glue_core-{{ version }}.tar.gz
  sha256: df5f0c2acf8c4f9190ad85ab75d8899e5e6e7f5092f8bdd1c7198b7401c6c4c3

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  noarch: python
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - setuptools-scm
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.17
    - matplotlib-base >=3.2
    - scipy >=1.1
    - pandas >=1.2
    - echo >=0.12
    - astropy-base >=4.0
    - fast-histogram >=0.12
    - ipython >=4.0
    - dill >=0.2
    - h5py >=2.10
    - xlrd >=1.2
    - openpyxl >=3.0
    - mpl-scatter-density >=0.8
    - importlib-resources >=1.3
    - importlib-metadata >=3.6
    - shapely >=2.0

    # Optional dependencies (defined in ``extras_require``)
    - scikit-image

test:
  requires:
    - pip
    - pytest
    - python {{ python_min }}
  imports:
    - glue
    - glue.core
  commands:
    - pip check
    - pytest --pyargs glue

about:
  home: http://glueviz.org
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Multi-dimensional linked data exploration

extra:
  recipe-maintainers:
    - astrofrog
    - izahn
